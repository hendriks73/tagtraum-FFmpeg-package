name: Build and Test

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main


jobs:

  macos-build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ macos-15, macos-latest ]
        arch: [ x64, aarch64 ]
        include:
          - arch: x64
            jarch: x86_64
          - arch: aarch64
            jarch: aarch64
    steps:
      - name: Install Tools
        run: |
          brew install yasm
      - uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          architecture: x64
          distribution: zulu
          cache: maven

      # cache maven repo for faster builds
      - uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build/test code with Maven
        run: mvn --activate-profiles compile,ffmpeg-${{ matrix.jarch }}-macos --batch-mode install --file pom.xml


  windows-build:

    runs-on: windows-latest
    strategy:
      matrix:
        arch: [ x64, x86 ]
        include:
          - arch: x64
            jarch: x86_64
            sys: mingw64
            env: x86_64
            repo: mingw64

          - arch: x86
            jarch: i386
            sys: mingw32
            env: i686
            repo: mingw32

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.sys }}
          update: false        # do NOT upgrade — we pin the toolchain below
          path-type: inherit

      - name: Pin toolchain to gcc 11.2.0 / binutils 2.37 via MSYS2 time-machine
        run: |
          # Point pacman at the MSYS2 archive snapshot from 2021-11-01
          # (gcc 11.2.0 + binutils 2.37 were current at this date)
          cat > /etc/pacman.d/mirrorlist.mingw <<'EOF'
          Server = https://repo.msys2.org/mingw/$repo/
          EOF
    
          # Rewrite the repo Server entries in pacman.conf to the archive date
          sed -i "s|Include = /etc/pacman.d/mirrorlist.mingw.*||" /etc/pacman.conf
          cat >> /etc/pacman.conf <<'EOF'
    
          [${{ matrix.sys }}]
          Server = https://repo.msys2.org/mingw/sources/
          EOF
    
          # Install packages directly from the archive by URL
          BASE="https://repo.msys2.org/mingw/${{ matrix.repo }}"
          pacman --noconfirm -U --overwrite "*" \
            "${BASE}/mingw-w64-${{ matrix.env }}-binutils-2.37-3-any.pkg.tar.zst" \
            "${BASE}/mingw-w64-${{ matrix.env }}-gcc-libs-11.2.0-1-any.pkg.tar.zst" \
            "${BASE}/mingw-w64-${{ matrix.env }}-gcc-11.2.0-1-any.pkg.tar.zst" \
            "${BASE}/mingw-w64-${{ matrix.env }}-yasm-1.3.0-4-any.pkg.tar.zst"
    
          - uses: actions/checkout@v2
    
          - name: Set up Java
            uses: actions/setup-java@v5
            with:
              java-version: 17
              architecture: ${{ matrix.arch }}
              distribution: zulu
              cache: maven
    
          # cache maven repo for faster builds
          - uses: actions/cache@v5
            with:
              path: ~/.m2/repository
              key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
              restore-keys: |
                ${{ runner.os }}-maven-
    
          - name: Build/test code with Maven
            run: |
              which mvn
              mvn --activate-profiles compile,ffmpeg-${{ matrix.jarch }}-win --batch-mode install --file pom.xml


  linux-build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-22.04, ubuntu-latest ]
        arch: [ x64 ]
        include:
          - arch: x64
            jarch: x86_64

    steps:
      - name: Set up compression libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libbz2-dev zlib1g-dev

      - uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: zulu
          cache: maven

      # cache maven repo for faster builds
      - uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build/test code with Maven
        run: mvn --activate-profiles compile,ffmpeg-${{ matrix.jarch }}-linux --batch-mode install --file pom.xml

  linux-arm-build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-24.04-arm ]
        arch: [ aarch64 ]
        include:
          - arch: aarch64
            jarch: aarch64

    steps:
      - name: Set up compression libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libbz2-dev zlib1g-dev

      - uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: zulu
          architecture: arm64
          cache: maven

      # cache maven repo for faster builds
      - uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build/test code with Maven
        run: mvn --activate-profiles compile,ffmpeg-${{ matrix.jarch }}-linux --batch-mode install --file pom.xml
